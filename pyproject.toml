[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-connector"
version = "0.6.0"
description = "The MISP AI module (ai_connector): summaries, tag suggestions and CTI extraction for a MISP Event"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["pymisp>=2.5.34.2", "iocextract>=1.16.1"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pylint"]
e2e = ["misp-modules"]

[tool.setuptools]
packages = ["expansion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/test_e2e_misp_ai_actions.py" = ["F811"]  # fixtures imported from test_e2e_misp_write

[tool.pylint.main]
py-version = "3.14"

[tool.pylint.messages_control]
disable = [
  "missing-module-docstring",
  "missing-function-docstring",
  "missing-class-docstring",
]
