name: checks

on:
  push:
  pull_request:

env:
  RUFF: "0.16.6"

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: ruff (same commands as CLAUDE.md)
        run: |
          uvx ruff@${RUFF} check .
          uvx ruff@${RUFF} format --check expansion genai tests benchmarks

  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --extra dev
      # fixme notes are allowed to live in the tree; every other message fails the job
      - run: uv run pylint --disable=fixme expansion genai tests benchmarks

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --extra dev --extra e2e
      # CI-only, hash-pinned: lets the prompt-card schema check run (it skips without jsonschema)
      - run: uv pip install --require-hashes -r .github/schema-requirements.txt
      # Offline layers only: unit tests, the MISP contract gate and the local misp-modules
      # server e2e. Every live layer (LLM, MISP, misp-tag-suggest) skips itself when CI is set
      # (tests/conftest.py live_gate); they run from a developer machine (docs/TESTING.md).
      - run: uv run pytest -q

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx semgrep scan --config p/python --config p/security-audit --error expansion genai benchmarks tests
